apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api-lab
  labels:
    app.kubernetes.io/name: orders-api-lab
    app.kubernetes.io/instance: orders-api-lab
    app.kubernetes.io/component: orders-api
    app.kubernetes.io/part-of: kantyna
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-api-lab
      app.kubernetes.io/instance: orders-api-lab
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-api-lab
        app.kubernetes.io/instance: orders-api-lab
        app.kubernetes.io/component: orders-api
        app.kubernetes.io/part-of: kantyna
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: orders-api
          image: 123456789012.dkr.ecr.eu-central-1.amazonaws.com/kantyna/orders-api:0.0.0-dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: AWS_REGION
              value: eu-central-1
            - name: OTEL_SERVICE_NAME
              value: orders-api
            - name: LOG_LEVEL
              value: INFO
            - name: FLAGS_FILE
              value: /etc/kantyna/flags/flags.json
            - name: PAYMENTS_URL
              value: http://kantyna-payments:8080
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: kantyna-db
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kantyna-db
                  key: password
            - name: DATABASE_URL
              value: postgresql://$(DB_USER):$(DB_PASSWORD)@kantyna-postgres:5432/kantyna
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: flags
              mountPath: /etc/kantyna/flags
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: flags
          configMap:
            name: kantyna-flags
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
